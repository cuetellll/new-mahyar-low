[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahyar-compressor"
version = "2.0.0"
description = "Mahyar Compressor – Fullscreen Cyber Video Compressor with interactive mouse background, bottom mini-dock, system tray, and GPU acceleration."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Mahyar" }
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "imageio-ffmpeg>=0.5",
]
keywords = [
    "mahyar",
    "video",
    "compressor",
    "ffmpeg",
    "gui",
    "pyside6",
    "qt",
    "h265",
    "hevc",
    "nvenc",
    "transcoder"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.6",
    "pillow>=10.0",
]

[project.scripts]
mahyar-compressor = "vidshrink.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
